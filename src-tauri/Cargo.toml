[package]
name = "claude-manager"
version = "0.1.4"
description = "Claude Code session manager"
authors = ["xbuddhi"]
edition = "2024"
rust-version = "1.94"
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (https://github.com/rust-lang/cargo/issues/8519).
name = "claude_manager_lib"
# Desktop only: the binary links the rlib. staticlib/cdylib are for mobile targets and only add build output.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Every crate the work packages plan to use is declared here, once, so parallel packages never edit this
# file or Cargo.lock. The owner of each group is noted; a crate nobody uses yet costs only build time.
[dependencies]
# tray-icon + image-png: tray / menu bar icon (WP9)
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
# built but not registered until a release endpoint and signing key exist (WP10, see docs/port/README.md)
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
dirs = "7"
thiserror = "2"
ts-rs = "12"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
log = "0.4"
# session index: fast line scanning, parallel cold scan, file watching (WP1)
memchr = "2"
rayon = "1"
notify = "8"
notify-debouncer-full = "0.6"
# Recycle Bin / Trash (WP5)
trash = "5"
# plan limits over HTTPS, keychain service names, reset times (WP7)
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# file tree: .gitignore-aware listing (files)
ignore = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
# Explorer right-click menu in HKCU (WP9)
winreg = "0.56"
# WebView2 memory target on blur/minimize (WP9); must match the version wry uses
webview2-com = "0.39"
# taskbar Jump List (os/jumplist.rs): COM shell interfaces; the version Tauri uses
windows = { version = "0.62", features = [
  "Win32_Storage_EnhancedStorage",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Dock menu (os/dock.rs): Tauri has no API for it. muda must stay on the version Tauri uses, so its menu
# events reach Tauri's handler.
muda = { version = "0.20", default-features = false }
objc2 = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# Dev builds keep only line tables (backtraces and breakpoints still work, local variables do not): most of
# an incremental rebuild is emitting and linking debug info.
[profile.dev]
debug = "line-tables-only"

# Dependencies are optimized in dev builds too: transcript scanning and the PTY pump are slow at opt-level 0.
# Their debug info is dropped; nobody steps through them.
[profile.dev.package."*"]
opt-level = 2
debug = false

# https://tauri.app/concept/size/#cargo-configuration
# panic stays "unwind": a panic in a worker thread is logged and must not take running sessions down with it.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
