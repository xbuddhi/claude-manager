# Release: pushing a tag vX.Y.Z (equal to the version in src-tauri/Cargo.toml) builds the Windows installer
# and the universal macOS app and dmg, and uploads them to a DRAFT GitHub release; review it, then publish.
# Signing, notarization and in-app updates turn on as their secrets and variables are added (README,
# "Releasing"); a part whose secrets are missing is built without it, and the release notes say so.
# Third-party actions are pinned by commit SHA (tag in the comment) so a moved tag cannot change what runs.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Release script tests
        run: node --test "scripts/*.test.mjs"

      - name: Tag matches the app version
        run: node scripts/bump-version.mjs --check "$GITHUB_REF_NAME"

      # only checks which secrets exist, to say in the notes what this build lacks; never prints them
      - name: Release notes
        id: notes
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          UPDATER_PUBKEY: ${{ vars.UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          node scripts/release-config.mjs notes "$GITHUB_REF_NAME" > notes.md
          cat notes.md
          { echo 'notes<<EOF_RELEASE_NOTES'; cat notes.md; echo 'EOF_RELEASE_NOTES'; } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from package.json packageManager)

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # rustup reads the pinned toolchain from src-tauri/rust-toolchain.toml
      - name: Install Rust toolchain
        working-directory: src-tauri
        run: rustup toolchain install

      - name: Add the Apple Silicon and Intel targets
        if: runner.os == 'macOS'
        working-directory: src-tauri
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # Writes release.conf.json (updater artifacts + endpoint, Windows signing) for `tauri build --config`,
      # and passes on only the signing secrets that are set and apply to this OS (an empty APPLE_CERTIFICATE
      # would fail the build).
      - name: Release configuration
        id: config
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          UPDATER_PUBKEY: ${{ vars.UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: node scripts/release-config.mjs build release.conf.json

      - name: Install the Azure Trusted Signing client
        if: steps.config.outputs.trusted_signing == 'true'
        run: cargo install trusted-signing-cli --version 0.11.0 --locked

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Claude Manager ${{ github.ref_name }}
          releaseBody: ${{ needs.prepare.outputs.notes }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} --config ${{ steps.config.outputs.config }}
