<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Manager</title>
    <link rel="icon" href="data:," />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <!-- Layout shell (foundation-owned). Features render only into the *-slot / *-root elements. -->
    <header id="titlebar" data-tauri-drag-region="deep">
      <div id="tb-left">
        <div id="tb-profile-slot"></div>
        <div id="tb-title">
          <span class="tb-name">Claude Manager</span>
          <span class="tb-sub" id="tb-subtitle">Loading...</span>
        </div>
      </div>
      <div id="tb-search-slot"></div>
      <div id="tb-right-slot"></div>
      <div id="tb-caption"></div>
    </header>
    <div id="picker-root" hidden></div>
    <main id="main">
      <!-- Docked style: the sidebar runs the full height; tabs and the Home card or a terminal sit beside it -->
      <div id="workspace">
        <aside id="sidebar-slot"></aside>
        <div id="workspace-splitter"></div>
        <div id="content">
          <div id="tabstrip-slot" data-tauri-drag-region="deep"></div>
          <div id="panes">
            <section id="card">
              <header id="card-head">
                <div id="card-switch"></div>
                <div id="card-actions-slot"></div>
              </header>
              <div id="card-body"></div>
            </section>
            <div id="terminal-root"></div>
          </div>
        </div>
      </div>
    </main>
    <div id="overlay-root"></div>
  </body>
</html>
